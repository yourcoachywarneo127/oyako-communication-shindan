name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチ名が master の場合は master に変更してください

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    # run コマンドを実行する作業フォルダを一括でサブフォルダに指定
    defaults:
      run:
        working-directory: ./oyako-communication-shindan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 出力される out フォルダの場所をサブフォルダからのパスで指定
          path: ./oyako-communication-shindan/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
