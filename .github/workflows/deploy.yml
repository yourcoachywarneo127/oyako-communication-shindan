name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      # out フォルダの場所を検出して `./out` に配置するステップ
      - name: Locate build output
        run: |
          if [ -d "./out" ]; then
            echo "Found ./out"
          elif [ -d "./oyako-communication-shindan/out" ]; then
            echo "Found ./oyako-communication-shindan/out, moving..."
            mv ./oyako-communication-shindan/out ./out
          else
            echo "Searching for out directory..."
            OUT_DIR=$(find . -maxdepth 3 -type d -name "out" | head -n 1)
            if [ -n "$OUT_DIR" ]; then
              echo "Found out at $OUT_DIR, moving to ./out"
              mv "$OUT_DIR" ./out
            else
              echo "out directory not found!"
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
