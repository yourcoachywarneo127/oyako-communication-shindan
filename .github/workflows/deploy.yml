name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      # out フォルダが存在しない場合の自動検出・救済処理
      - name: Ensure out directory
        run: |
          if [ -d "./out" ]; then
            echo "out directory exists!"
          else
            echo "out directory not found. Searching in subdirectories..."
            OUT_PATH=$(find . -name "out" -type d -not -path '*/node_modules/*' | head -n 1)
            if [ -n "$OUT_PATH" ]; then
              echo "Moving $OUT_PATH to ./out"
              mv "$OUT_PATH" ./out
            else
              echo "out folder is missing! Contents of root directory:"
              ls -la
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
