name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # ブランチ名が master の場合は "master" に変更してください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Nodeのバージョンを推奨版に更新

      - name: Install dependencies
        run: npm install # package-lock.json がなくても動作するコマンドに変更

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
